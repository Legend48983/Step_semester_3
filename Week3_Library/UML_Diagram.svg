<rect width="1200" height="760" fill="white"/>
<style>text{font-family:Arial;font-size:18px;fill:#111}.head{font-size:24px;font-weight:bold}</style>
<rect x="50" y="60" width="330" height="280" fill="white" stroke="black" stroke-width="3"/>
<text x="70" y="95" class="head">Author</text><line x1="50" y1="115" x2="380" y2="115" stroke="black"/>
<text x="70" y="150">name : String</text><text x="70" y="180">numberOfBooksWritten : int</text><text x="70" y="210">bio : String</text>
<text x="70" y="255">displayBio()</text><text x="70" y="285">getName()</text>
<rect x="480" y="60" width="400" height="340" fill="white" stroke="black" stroke-width="3"/>
<text x="500" y="95" class="head">Book</text><line x1="480" y1="115" x2="880" y2="115" stroke="black"/>
<text x="500" y="150">title : String</text><text x="500" y="180">author : Author</text><text x="500" y="210">publicationYear : int</text><text x="500" y="240">available : boolean</text>
